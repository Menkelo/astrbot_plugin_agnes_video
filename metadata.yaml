name: astrbot_plugin_agnes_video
display_name: Agnes Video 2.5 Flash
short_desc: 基于 Agnes AI Video 2.5 Flash 的 AI 视频生成插件，支持文生视频、图生视频、首尾帧关键帧与多图参考生成。
desc: |
  异步 AI 视频生成插件，对接 Agnes AI Video 2.5 Flash（OpenAI Videos 兼容接口），输出固定 720P：
  - 文生视频：通过文本提示词直接生成电影级视频。
  - 图生视频：消息中附带或引用一张图片，作为首帧将静态图片转化为动态视频。
  - 首尾帧关键帧动画：引用两张图片，在首尾关键帧之间生成流畅过渡。
  - 多图参考生成：引用三张及以上（最多 5 张）图片，作为内容与风格参考生成视频。
  - 自动分流：单个 /vgen 命令根据消息中的图片数量自动选择生成模式。
  - 异步任务管理：创建任务后后台自动轮询，生成完成自动推送视频，无需用户等待。
  - 多 Key 轮询：配置多个 API Key 时自动轮换使用，规避单 Key 限流。

  使用方式（在机器人会话中发送）：
  - /vgen <提示词>  文生视频
  - /vgen <提示词>（消息附带一张图片）  图生视频
  - /vgen <提示词>（引用含两张图片的消息）  首尾帧关键帧动画
  - /vgen <提示词>（引用含三张及以上图片的消息）  多图参考生成

  需要先在插件配置中填写 Agnes AI 官网申请的 API Key。
version: 1.2.0
author: Menkelo
repo: https://github.com/Menkelo/astrbot_plugin_agnes_video
